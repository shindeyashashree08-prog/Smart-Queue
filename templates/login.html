{% extends "base.html" %}

{% block title %}User Login - SmartQueue{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <h2>User Login</h2>
        <p>Access your queue dashboard and live token status</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">Sign In</button>
    </form>

    <div class="form-footer">
        Don't have an account yet? <a href="{{ url_for('register') }}">Create an account</a>
        <br><br>
        Are you an administrator? <a href="{{ url_for('admin_login') }}">Admin Login</a>
    </div>
</div>
{% endblock %}
